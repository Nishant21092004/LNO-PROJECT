name: Validate LNO project
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v
      - name: Run original demo with comparisons
        env:
          MPLBACKEND: Agg
        run: python run_demo.py
      - name: Verify generated reports
        run: |
          test -s results/06_algorithm_comparison.png
          test -s results/07_post_disruption_comparison.png
          test -s results/comparison_summary.csv
      - name: Upload generated plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lno-demo-results
          path: |
            results/*.png
            results/*.csv
          if-no-files-found: warn
